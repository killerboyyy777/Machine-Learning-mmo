name: Release

# Cutting a release is one step: `git tag vX.Y && git push origin vX.Y`.
# Paste the matching CHANGELOG section into the release notes on GitHub
# afterwards (or use the auto-generated notes and link the changelog).
# Then set the title, which nothing here does: the release step passes no
# `name:`, so the title defaults to the bare tag.
#   gh release edit vX.Y --title "vX.Y - <theme>" --notes-file <section.md>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub release for tag
    runs-on: ubuntu-latest
    env:
      PROFILE_DISPATCH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_server_unit.py
      - run: python tests/test_quest_grind.py
      - run: python tests/test_snapshot_additions.py
      - run: python tests/test_conductor.py
      - run: python tests/test_reward_modes.py
      - run: python tests/test_scripted_bots.py
      - run: python tests/test_pbt.py
      - run: python tests/test_curriculum.py
      - run: python tests/test_plugins.py
      - run: python tests/test_env_reset.py
      - run: python tests/test_env_parsing.py
      - run: python tests/test_dashboard.py
      - run: python tests/test_tui.py
      - run: python tests/test_harness.py
      - run: python tests/test_snapshot_contract.py
      - run: python tests/test_scores_backup.py
      - run: python tests/test_training_loops.py
      - run: python tests/test_conductor_run.py
      - run: python tests/test_gm_unit.py
      - run: python tests/test_farm_resume.py
      - run: python tests/test_training_health.py
      - run: python tests/test_balance_harness.py
      - run: python tests/test_security.py
      - run: python tests/test_exploit_regressions.py
      - run: python tests/test_flee.py
      - run: python tests/test_mcp_client.py
      - run: python tests/test_modes.py
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      - name: Refresh agent profile metrics
        # The profile repo rebuilds its metrics on a daily cron; a release is
        # when the gate numbers actually change, so nudge it now instead of
        # waiting for midnight. No token skips the step, and a rejected token
        # only warns -- a stale profile must not turn a good release red.
        if: env.PROFILE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
            /repos/killerboyyy777-agent/killerboyyy777-agent/actions/workflows/metrics.yml/dispatches \
            -f ref=main
