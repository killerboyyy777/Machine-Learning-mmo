name: Release

# Cutting a release is one step: `git tag vX.Y && git push origin vX.Y`.
# The tag runs the full test suite, builds and smoke tests one standalone
# server bundle per platform, then creates the release with generated notes
# and the bundles, and publishes the versioned image. Rewrite that body from
# the pull requests since the previous tag, and set the title, which nothing
# here does: the release step passes no `name:`, so the title defaults to the tag.
#   gh release edit vX.Y --title "vX.Y - <theme>" --notes-file <body.md>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Full test suite (v* tag)
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  bundle:
    name: Standalone server bundle (${{ matrix.target }})
    needs: tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
          - os: windows-latest
            target: windows-x86_64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.22.3 websockets==17.4
      - name: Build bundle
        run: python scripts/build_bundle.py --target ${{ matrix.target }}
      - name: Smoke test built bundle
        run: python scripts/smoke_bundle.py --bundle-dir dist/bundle
      - name: Upload bundle and checksum
        uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.target }}
          path: |
            dist/bundle/*.zip
            dist/bundle/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release for tag
    needs: [tests, bundle]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PROFILE_DISPATCH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download bundles
        uses: actions/download-artifact@v7
        with:
          pattern: bundle-*
          path: bundles
          merge-multiple: true
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: bundles/*
      - name: Refresh agent profile metrics
        # The profile repo rebuilds its metrics on a daily cron; a release is
        # when the gate numbers actually change, so nudge it now instead of
        # waiting for midnight. No token skips the step, and a rejected token
        # only warns -- a stale profile must not turn a good release red.
        if: env.PROFILE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
            /repos/killerboyyy777-agent/killerboyyy777-agent/actions/workflows/metrics.yml/dispatches \
            -f ref=main

  publish-versioned:
    name: Publish versioned image to GHCR
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write

  publish-pypi:
    name: Publish wheel and sdist to PyPI
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: pypi
      url: https://pypi.org/p/small-text-mmo-engine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check tag matches pyproject version
        run: python scripts/check_release_version.py --tag "$GITHUB_REF_NAME"
      - name: Build and verify distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Publish with attestations
        uses: pypa/gh-action-pypi-publish@release/v1
