name: Release

# Cutting a release is one step: `git tag vX.Y && git push origin vX.Y`.
# The tag calls the full test suite, then creates the release with generated
# notes, then publishes the versioned image. Rewrite that body from the pull
# requests since the previous tag, and set the title, which nothing here
# does: the release step passes no `name:`, so the title defaults to the bare tag.
#   gh release edit vX.Y --title "vX.Y - <theme>" --notes-file <body.md>
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    name: Full test suite (v* tag)
    uses: ./.github/workflows/tests.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release for tag
    needs: tests
    runs-on: ubuntu-latest
    env:
      PROFILE_DISPATCH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
      - name: Refresh agent profile metrics
        # The profile repo rebuilds its metrics on a daily cron; a release is
        # when the gate numbers actually change, so nudge it now instead of
        # waiting for midnight. No token skips the step, and a rejected token
        # only warns -- a stale profile must not turn a good release red.
        if: env.PROFILE_DISPATCH_TOKEN != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PROFILE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST \
            /repos/killerboyyy777-agent/killerboyyy777-agent/actions/workflows/metrics.yml/dispatches \
            -f ref=main

  publish-versioned:
    name: Publish versioned image to GHCR
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
