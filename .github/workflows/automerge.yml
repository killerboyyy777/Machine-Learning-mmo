name: Dependabot auto-merge

# Auto-approve + auto-merge Dependabot patch/minor updates once CI is
# green (#89). Major updates still need a human. Requires the repo
# allow_auto_merge setting (public/Pro); the approve step below satisfies
# review-gated branches, and is a harmless no-op where no approval is
# required (this repo's ruleset currently requires none -- solo-dev
# deadlock otherwise; see CONTRIBUTING and enable-protection.sh).
on:
  pull_request_target

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: dependabot/fetch-metadata@v3
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve patch/minor
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge
        if: ${{ steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor' }}
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
