name: Tests

on:
  push:
    # agent/**: contributor pushes otherwise trigger nothing (push CI
    # reads workflow files from the pushed branch, and agent branches
    # predate every CI addition). Scheduled agent-sync remains the
    # backstop for branches that never merge master in.
    branches: [master, "review/**", "agent/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Unit, grind, conductor (no server/torch needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_server_unit.py
      - run: python tests/test_quest_grind.py
      - run: python tests/test_conductor.py
      - run: python tests/test_reward_modes.py
      - run: python tests/test_scripted_bots.py
      - run: python tests/test_pbt.py
      - run: python tests/test_curriculum.py
      - run: python tests/test_plugins.py
      - run: python tests/test_env_reset.py
      - run: python tests/test_env_parsing.py
      - run: python tests/test_dashboard.py
      - run: python tests/test_snapshot_contract.py
      - run: python tests/test_scores_backup.py
      - run: python tests/test_training_loops.py
      - run: python tests/test_conductor_run.py
      - run: python tests/test_gm_unit.py

  live:
    name: Live protocol + ML env (fresh server, seed 700)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install websockets==17.1
      - run: echo '{}' > scores.json
      - run: TEXTMMO_GM_SEED=700 nohup python server.py > server.ci.log 2>&1 &
      - run: sleep 5
      - run: python tests/test_live.py
      - run: python tests/test_env.py
      - run: python ml/conductor/soak.py --agents 2 --duration 20 --min-agents 1 --base-dir soak_smoke
      - run: python -c "import json; d=json.load(open('soak_smoke/soak_report.json')); assert 'tables' in d, d; print('SOAK_SMOKE_OK')"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-failure-logs
          path: |
            server.ci.log
            scores.json

  persistence:
    name: Checkpoint save/load round-trip (needs torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tests/test_persistence.py
      - run: python tests/test_rnd.py
      - run: python tests/test_runners.py
      - run: python tests/test_eval_stats.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt

  lint:
    # No-new-violations gate (file-level black --check punishes touching
    # legacy files, proven by 106 on server.py/registry.py): for each
    # changed file, black must not go clean->dirty vs merge-base, and ruff
    # must not gain violations vs merge-base. New files must be clean.
    # mypy stays advisory (not gated).
    name: Lint changed Python files (no-new-violations black + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install black ruff
      - run: |
          base=$(git merge-base origin/master HEAD)
          files=$(git diff --name-only "$base"...HEAD -- '*.py')
          if [ -z "$files" ]; then echo "no python files changed"; exit 0; fi
          echo "$files"
          fail=0
          for f in $files; do
            [ -f "$f" ] || continue
            # black: fail only on clean(base)->dirty(head) transitions.
            base_ok=0
            if git show "$base:$f" 2>/dev/null | black --check - >/dev/null 2>&1; then
              base_ok=1
            fi
            if [ "$base_ok" = "1" ] && ! black --check "$f" >/dev/null 2>&1; then
              echo "BLACK-REGRESSION: $f clean at base, dirty at head"
              black --check --diff "$f" || true
              fail=1
            fi
            # ruff: fail only when the violation count grows vs base.
            base_n=$(git show "$base:$f" 2>/dev/null | ruff check --output-format=concise --stdin-filename "$f" - 2>/dev/null | grep -cE ':[0-9]+:[0-9]+: ' || true)
            head_n=$(ruff check --output-format=concise -- "$f" 2>/dev/null | grep -cE ':[0-9]+:[0-9]+: ' || true)
            if [ "${head_n:-0}" -gt "${base_n:-0}" ]; then
              echo "RUFF-REGRESSION: $f base=$base_n head=$head_n"
              ruff check -- "$f" || true
              fail=1
            fi
          done
          exit $fail

  node-harness:
    name: Dashboard smoke (node stub + headless Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install websockets==17.1
      - run: node --version
      - run: (google-chrome --version || chromium --version || true)
      - run: echo '{}' > scores.json
      - run: TEXTMMO_GM_SEED=700 nohup python server.py > server.ci.log 2>&1 &
      - run: sleep 5
      - run: node tests/dash2_smoke.cjs
      - run: python tests/dash_browser_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard-shots
          path: |
            dashshots/
            server.ci.log
