name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  offline:
    name: Unit, grind, conductor (no server/torch needed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_server_unit.py
      - run: python tests/test_quest_grind.py
      - run: python tests/test_conductor.py
      - run: python tests/test_reward_modes.py
      - run: python tests/test_scripted_bots.py
      - run: python tests/test_pbt.py
      - run: python tests/test_curriculum.py
      - run: python tests/test_plugins.py

  live:
    name: Live protocol + ML env (fresh server, seed 700)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets==17.1
      - run: echo '{}' > scores.json
      - run: TEXTMMO_GM_SEED=700 nohup python server.py > server.ci.log 2>&1 &
      - run: sleep 5
      - run: python tests/test_live.py
      - run: python tests/test_env.py
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-failure-logs
          path: |
            server.ci.log
            scores.json

  persistence:
    name: Checkpoint save/load round-trip (needs torch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python tests/test_persistence.py
      - run: python tests/test_rnd.py
      - run: python tests/test_runners.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt
