  live:
    name: Live protocol + ML env (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install websockets==17.4
      - run: echo '{}' > scores.json
      - run: TEXTMMO_GM_SEED=700 nohup python server.py > server.ci.log 2>&1 &
      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8766/health > /dev/null; then
              echo "SERVER_HEALTHY after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not answer /health within 60s"
          cat server.ci.log
          exit 1
      - run: python tests/test_live.py
      - run: python tests/test_env.py
      - run: python ml/conductor/soak.py --agents 2 --duration 20 --min-agents 1 --base-dir soak_smoke
      - run: python -c "import json; d=json.load(open('soak_smoke/soak_report.json')); assert 'tables' in d, d; print('SOAK_SMOKE_OK')"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: live-failure-logs-py${{ matrix.python-version }}
          path: |
            server.ci.log
            scores.json

  persistence:
    name: Checkpoint save/load round-trip (needs torch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install -r requirements-train.txt
      - run: python tests/test_persistence.py
      - run: python tests/test_rnd.py
      - run: python tests/test_runners.py
      - run: python tests/test_eval_stats.py
      - run: python tests/test_eval_rewards.py

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pip-audit
      - run: pip-audit -r requirements.txt

  lint:
    name: Full-repository Ruff + Black
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install black==24.8.0 ruff==0.6.9
      - name: Check all Python files with Ruff
        run: ruff check .
      - name: Check all Python files with Black
        run: black --check .

  node-harness:
    name: Dashboard smoke (node stub + headless Firefox)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: pip install websockets==17.4 playwright
      - run: node --version
      # install-deps shells out to apt; the EC2 mirror can stall mid-download
      # without failing, so interrupting apt leaves the dpkg frontend lock held
      # and no retry can recover. Point apt at the fast mirror before installing.
      - name: Cache Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ runner.os }}-${{ hashFiles('.github/workflows/tests.yml') }}
      - name: Pin apt mirror to Azure
        run: |
          printf 'http://azure.archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -exec sed -i -E 's#https?://[^/]*ec2\.archive\.ubuntu\.com#http://azure.archive.ubuntu.com#g' {} + || true
      - name: Install Firefox system dependencies
        run: python -m playwright install-deps firefox
      - name: Install Firefox browser
        run: python -m playwright install firefox
      - run: echo '{}' > scores.json
      - run: TEXTMMO_GM_SEED=700 nohup python server.py > server.ci.log 2>&1 &
      - name: Wait for server health
        run: |
          for i in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:8766/health > /dev/null; then
              echo "SERVER_HEALTHY after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Server did not answer /health within 60s"
          cat server.ci.log
          exit 1
      - run: node tests/dash2_smoke.cjs
      - run: node tests/dashboard_regressions.cjs
      - run: python tests/dash_browser_smoke.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: dashboard-shots
          path: |
            dashshots/
            server.ci.log
