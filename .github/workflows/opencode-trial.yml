name: opencode-trial
on:
  issue_comment:
    types: [created]
jobs:
  opencode:
    if: github.actor == 'killerboyyy777' && startsWith(github.event.comment.body, '/oc ')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/muse-spark-1.3-contributor-free
          use_github_token: true
          prompt: |
            Explain-only trial. Read the thread, explain or answer factually.
            Do NOT create branches, commits, or PRs. Do NOT push. Reply in-thread only.
