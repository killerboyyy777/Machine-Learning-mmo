# area:server — game engine, protocol, world systems (+ Docker packaging,
# which ships the server)
area:server:
  - changed-files:
      - any-glob-to-any-file:
          - server.py
          - world.json
          - Dockerfile
          - compose.yaml
          - .dockerignore

# area:ml-env — observations, actions, rewards
area:ml-env:
  - changed-files:
      - any-glob-to-any-file:
          - ml/**/*

# area:torch-agents — PyTorch DQN agent and farm
area:torch-agents:
  - changed-files:
      - any-glob-to-any-file:
          - torch_agents/**/*

# area:tests — unit, live, grind, persistence suites
area:tests:
  - changed-files:
      - any-glob-to-any-file:
          - tests/**/*

# area:docs — README, CHANGELOG, protocol docs
area:docs:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CHANGELOG.md
          - TODO.md
          - docs/**/*

# area:dashboard — live dashboard, GM panel, charts
area:dashboard:
  - changed-files:
      - any-glob-to-any-file:
          - dashboard.html

# area:market, area:quests, balance: intentionally NOT path-mapped.
# server.py/world.json touch every market/quest/balance change but also
# everything else, so auto-tagging them here mistagged most PRs (seen on
# #220, #259). Humans add these labels per-PR when relevant.

# area:conductor — large-scale orchestrator
area:conductor:
  - changed-files:
      - any-glob-to-any-file:
          - ml/conductor/**/*

# balance: intentionally not path-mapped (see area:market note above).

# documentation — docs and guides
documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CHANGELOG.md
          - TODO.md
          - docs/**/*