# Pre-commit hooks (#57): black, ruff, mypy, fast test scripts.
#
# Hooks run on staged files only, so legacy files get cleaned incrementally
# as they are touched -- no flag day. ruff uses the full default ruleset;
# the remaining legacy hits (unused imports, blind excepts in older
# modules) fail only when those files are staged, which is the nudge to
# clean them. mypy runs lenient (untyped defs are routine here).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2000"]
  - repo: https://github.com/psf/black
    rev: 24.8.0
    hooks:
      - id: black
        language_version: python3
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []
  - repo: local
    hooks:
      - id: fast-unit
        name: fast tests (unit, no server/torch)
        entry: python tests/test_server_unit.py
        language: system
        pass_filenames: false
        always_run: true
      - id: fast-grind
        name: fast tests (grind, no server/torch)
        entry: python tests/test_quest_grind.py
        language: system
        pass_filenames: false
        always_run: true
      - id: fast-dashboard
        name: fast tests (dashboard markup, no server/torch)
        entry: python tests/test_dashboard.py
        language: system
        pass_filenames: false
        always_run: true
